[package]
name = "libre-eventlog"
version = "0.3.0"
description = "Lecteur d'événements Windows critiques avec correctifs suggérés"
authors = ["libreflow"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
quick-xml = "0.42.0"
tauri-plugin-notification = "2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
